# Include this server block in the HTTPS virtual host for dahalabhishek.com.np.
location ~* \.(?:avif|webp|png|jpe?g|gif|svg|css|js|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location ~* \.html?$ {
    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    try_files $uri $uri/ =404;
}
