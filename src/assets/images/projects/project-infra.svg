<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="800" height="480" fill="url(#bg3)"/>
  
  <!-- Frame -->
  <rect x="50" y="40" width="700" height="400" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  <!-- Top bar -->
  <rect x="50" y="40" width="700" height="38" rx="10" fill="#020617"/>
  <circle cx="75" cy="59" r="6" fill="#ef4444"/>
  <circle cx="95" cy="59" r="6" fill="#f59e0b"/>
  <circle cx="115" cy="59" r="6" fill="#10b981"/>
  <rect x="150" y="49" width="350" height="20" rx="4" fill="#0f172a"/>
  <text x="160" y="63" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">internal://cluster-metrics.private.lan</text>

  <!-- Sidebar -->
  <rect x="50" y="78" width="150" height="362" fill="#020617"/>
  <rect x="70" y="105" width="110" height="12" rx="3" fill="#334155"/>
  <rect x="70" y="135" width="90" height="10" rx="2" fill="#1e293b"/>
  <rect x="70" y="160" width="100" height="10" rx="2" fill="#1e293b"/>
  <rect x="70" y="185" width="80" height="10" rx="2" fill="#1e293b"/>
  <rect x="70" y="210" width="95" height="10" rx="2" fill="#1e293b"/>

  <!-- Main area: Metrics charts -->
  <rect x="230" y="105" width="490" height="120" rx="6" fill="#020617" stroke="#1e293b" stroke-width="1"/>
  <text x="250" y="130" fill="#94a3b8" font-family="monospace" font-size="12">Server Cluster Status: HEALTHY</text>
  <polyline points="250,195 310,170 380,185 450,150 520,165 590,140 680,145" fill="none" stroke="#10b981" stroke-width="3"/>

  <!-- Server nodes grid -->
  <rect x="230" y="245" width="235" height="150" rx="6" fill="#020617" stroke="#1e293b" stroke-width="1"/>
  <circle cx="260" cy="275" r="8" fill="#10b981"/>
  <text x="280" y="280" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600">Linode Node 01</text>
  <text x="280" y="305" fill="#64748b" font-family="monospace" font-size="11">CPU: 18% | RAM: 34%</text>
  <text x="280" y="325" fill="#64748b" font-family="monospace" font-size="11">Uptime: 99.98%</text>
  <rect x="250" y="355" width="190" height="8" rx="4" fill="#1e293b"/>
  <rect x="250" y="355" width="65" height="8" rx="4" fill="#0284c7"/>

  <rect x="485" y="245" width="235" height="150" rx="6" fill="#020617" stroke="#1e293b" stroke-width="1"/>
  <circle cx="515" cy="275" r="8" fill="#10b981"/>
  <text x="535" y="280" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600">Database Replica</text>
  <text x="535" y="305" fill="#64748b" font-family="monospace" font-size="11">MySQL 8.0 | Replication OK</text>
  <text x="535" y="325" fill="#64748b" font-family="monospace" font-size="11">Queries: 420 qps</text>
  <rect x="505" y="355" width="190" height="8" rx="4" fill="#1e293b"/>
  <rect x="505" y="355" width="110" height="8" rx="4" fill="#10b981"/>

  <!-- Watermark badge -->
  <rect x="550" y="420" width="190" height="18" rx="4" fill="#10b981" fill-opacity="0.2"/>
  <text x="645" y="433" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10" font-weight="600" text-anchor="middle">SAMPLE PLACEHOLDER (CONFIDENTIAL)</text>
</svg>
