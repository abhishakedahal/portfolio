  <!-- Product cards mockup -->
  <rect x="80" y="275" width="195" height="140" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <rect x="100" y="295" width="155" height="65" rx="4" fill="#1e293b"/>
  <rect x="100" y="375" width="110" height="12" rx="3" fill="#cbd5e1"/>
